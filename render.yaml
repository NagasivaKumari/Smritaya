services:
  - type: web
    name: smritaya
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: LYZR_API_KEY
        sync: false
      - key: LYZR_EXTRACTOR_AGENT_ID
        sync: false
      - key: LYZR_ADVISOR_AGENT_ID
        sync: false
      - key: LYZR_DRAFTER_AGENT_ID
        sync: false
      - key: SMRITAYA_SEED_EMAIL
        sync: false
      - key: SMRITAYA_SEED_PASSWORD
        sync: false
      - key: SMRITAYA_SEED_OMI
        sync: false